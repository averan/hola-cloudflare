<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤔</text></svg>">
  <style>
    :root { --bg: #f7f7fb; --text: #1b1b23; --muted: #6b6b7b; --accent: #f38020; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111116; --text: #f2f2f7; --muted: #a0a0b0; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; text-align: center;
           background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { font-size: clamp(32px, 7vw, 48px); margin: 8px 0; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { color: #fff; background: var(--accent); padding: 10px 22px; border-radius: 999px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <div style="font-size:48px">🤔</div>
    <h1>Error 404</h1>
    <p>Esta página no existe.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
